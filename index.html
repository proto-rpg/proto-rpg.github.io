<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>프로토타입 RPG</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="프로토 RPG">
<meta name="theme-color" content="#0b0a1e">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 가로 전용: 16:9 게임 화면 하나에 모든 UI를 겹쳐 올림 (왼쪽 아래 정보창 · 가운데 메뉴 · 오른쪽 스킬) */
:root{
  --bg:#070b0c; --glass:rgba(14,20,24,.78); --glass2:rgba(30,40,46,.88); --line:rgba(255,255,255,.16);
  --fg:#f1f5f2; --mute:#a3b4b2; --gold:#f2c14e; --crimson:#d9434f; --sky:#7cc4ff;
  --f-display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;align-items:center;justify-content:center;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}
/* 뷰어가 위쪽 버튼 자리만큼 띄우는 여백을 없애 세로를 꽉 채우고, 대신 양옆을 조금 비워 뷰어 버튼과 겹치지 않게 한다 */
:root{padding-top:0!important;padding-bottom:0!important;--vgap:min(env(safe-area-inset-top,0px),26px)}
.stage{position:relative;width:min(100%,calc(100vh*16/9));width:min(calc(100% - var(--vgap)*2),calc(100dvh*16/9));aspect-ratio:16/9;max-width:100%;container-type:size;font-size:3.4cqh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:var(--fg);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.ui{position:absolute;display:flex;gap:1.2cqh}

/* 왼쪽: 이동 */
.dpad{left:2%;bottom:3cqh;display:grid;grid-template-columns:repeat(3,11cqh);grid-template-rows:repeat(3,11cqh);gap:.8cqh}
.dpad button{border-radius:2.4cqh;background:var(--glass);border:1px solid var(--line);font-size:4cqh;color:#e9efec}
.dpad button:active{background:rgba(242,193,78,.35)}
#bJ{grid-area:1/2}#bL{grid-area:2/1}#bR{grid-area:2/3}#bD{grid-area:3/2}
.dpad i{grid-area:2/2;border-radius:50%;background:rgba(255,255,255,.06);margin:2.4cqh}

/* 가운데: 메뉴 */
.menu{left:50%;transform:translateX(-50%);bottom:1.2cqh;gap:.4cqh;background:transparent;border:none}
.menu button{background:transparent;border:none;width:10cqh;padding:.6cqh 0;display:flex;flex-direction:column;align-items:center;gap:.3cqh;font-family:var(--f-display);font-size:2.7cqh;color:#fff;text-shadow:0 0 .6cqh #000,0 .2cqh .4cqh #000;border-radius:1.4cqh}
.menu button:last-child{border-right:none}
.menu svg{width:6cqh;height:6cqh;stroke:currentColor;fill:rgba(20,28,34,.55);filter:drop-shadow(0 .2cqh .5cqh rgba(0,0,0,.9));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu button[aria-pressed="true"]{color:var(--gold);background:rgba(242,193,78,.12)}
.menu .dot{position:relative}
.menu .dot::after{content:"";position:absolute;top:-.3cqh;right:-1cqh;width:1.4cqh;height:1.4cqh;border-radius:50%;background:var(--crimson)}

/* 오른쪽: 스킬 */
.sk{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:1.6cqh;
  background:var(--glass2);border:1px solid var(--line);font-family:var(--f-display);line-height:1.1}
.sk small{font-family:var(--f-body);font-size:2.3cqh;color:var(--mute)}
#bAtk{right:2%;bottom:3cqh;width:19cqh;height:19cqh;border-radius:50%;font-size:4.4cqh;color:#ffe2b8;border:2px solid rgba(255,190,120,.75);background:radial-gradient(circle at 50% 40%,rgba(255,170,90,.38),rgba(30,40,46,.92) 70%);touch-action:none;user-select:none}
#bAtk svg{width:7cqh;height:7cqh;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bAtk.on{transform:scale(calc(var(--bs,1)*.94));background:radial-gradient(circle at 50% 40%,rgba(255,190,110,.6),rgba(30,40,46,.92) 70%)}
.ks{width:10.5cqh;height:10.5cqh;border-radius:50%;font-size:2.7cqh;color:#d8ecff;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--kc,rgba(120,200,255,.32)),rgba(30,40,46,.92) 72%);border-color:var(--kb,rgba(140,210,255,.6))}
.ks small{font-size:1.9cqh;line-height:1;position:relative;z-index:1;text-shadow:0 0 3px #000,0 0 3px #000}
.ks .nm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ks:not(.lock){justify-content:flex-end;padding-bottom:.5cqh}
.skic{height:8cqh;width:8cqh;border-radius:1.4cqh;flex:none}
.ks:disabled{opacity:var(--bo,1)}
.ks .cd{font-size:3.6cqh}
.ks.lock{color:var(--mute);background:var(--glass2);border-color:var(--line)}
.ks.lock svg{width:3.4cqh;height:3.4cqh;fill:none;stroke:currentColor;stroke-width:2}
#k1{right:calc(2% + 20.1cqh);bottom:3.9cqh}
#k2{right:calc(2% + 18.4cqh);bottom:15.1cqh}
#k3{right:calc(2% + 9.8cqh);bottom:22.5cqh}
#k4{right:calc(2% - 1.5cqh);bottom:22.4cqh}
.stage.editing #potB{pointer-events:auto}
#potB{right:calc(2% + 33cqh);bottom:17.5cqh;height:7cqh;padding:0 1.6cqh;flex-direction:row;gap:.6cqh;border-radius:3.5cqh;font-size:2.8cqh;color:#ffb3b3;pointer-events:none}
#potB.low{color:var(--mute)}
#bB{left:calc(50% + 24cqh);top:1.8cqh;width:17cqh;height:6.4cqh;font-size:2.8cqh;background:var(--crimson);border-color:var(--crimson);color:#fff;border-radius:4.5cqh}
#bB:disabled{background:var(--glass2);border-color:var(--line);color:var(--mute);opacity:1}
#bA{right:2%;top:2cqh;width:13cqh;height:7cqh;font-size:2.8cqh;border-radius:3.5cqh}
#bA[aria-pressed="true"]{color:#1a1a1a;background:var(--gold);border-color:var(--gold)}
#bF{right:calc(2% + 24cqh);top:2cqh;width:7cqh;height:7cqh;font-size:2.8cqh;border-radius:50%}
#bG{right:calc(2% + 14.5cqh);top:1.5cqh;width:8cqh;height:8cqh;border-radius:50%;padding:0}
#bG svg{width:4.8cqh;height:4.8cqh;stroke:#e6ecea;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bG[aria-pressed="true"]{border-color:var(--gold)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:2cqh;padding:1.4cqh 2cqh;background:rgba(255,255,255,.06);border-radius:1.4cqh;font-size:3cqh}
.setrow .sub{font-size:2.5cqh;color:var(--mute);margin-top:.3cqh}
.sw{appearance:none;-webkit-appearance:none;width:9cqh;height:5cqh;border-radius:2.5cqh;background:rgba(255,255,255,.18);position:relative;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:.6cqh;left:.6cqh;width:3.8cqh;height:3.8cqh;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--gold)}
.sw:checked::after{transform:translateX(4cqh)}
.sw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sk,.dpad{transform:scale(var(--bs,1));opacity:var(--bo,1)}
.dpad{transform-origin:left bottom}#bAtk,.ks,#potB,#bB{transform-origin:right bottom}
#bB:disabled{opacity:var(--bo,1)}
.stage.cut .sk,.stage.cut .dpad,.stage.cut .menu{visibility:hidden}
.stage.editing .sk,.stage.editing .dpad{outline:2px dashed var(--gold);outline-offset:3px;cursor:move;touch-action:none}
.editbar{position:absolute;left:50%;top:13cqh;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:2cqh;
  background:rgba(18,26,30,.95);border:1px solid var(--gold);border-radius:2cqh;padding:1.4cqh 2.4cqh;font-size:3cqh;white-space:nowrap}
.seg{display:flex;gap:1cqh}
.seg .btn[aria-pressed="true"]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.rng{width:30cqh;accent-color:var(--gold)}
.keyb{min-width:16cqh;font-family:var(--f-display)}
.keyb.wait{border-color:var(--gold);color:var(--gold)}
.cd{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:4cqh;color:#fff}

/* 팝업 창 */
.pop{position:absolute;left:16%;right:16%;top:6cqh;bottom:17cqh;background:rgba(18,26,30,.96);border:1px solid rgba(242,193,78,.55);border-radius:2cqh;
  display:flex;flex-direction:column;box-shadow:0 2cqh 6cqh rgba(0,0,0,.5);z-index:5}
.pop.wide{left:5%;right:5%;top:3cqh}
.mis{position:absolute;left:1.3%;top:21cqh;width:36cqh;padding:1cqh 1.4cqh 1.2cqh;display:grid;grid-template-columns:1fr;gap:.5cqh;text-align:left;background:rgba(12,20,22,.72);border:1px solid var(--line);border-radius:1.4cqh;color:#fff;opacity:var(--bo,1)}
.mis b{font-family:var(--f-display);font-weight:400;font-size:2.5cqh;color:#9fd0ff}.mis span{font-size:2.3cqh}
.mis i{display:block;height:1.2cqh;border-radius:1cqh;background:rgba(0,0,0,.5);overflow:hidden}.mis u{display:block;height:100%;background:var(--gold);width:0}
.mis em{display:none;position:absolute;left:calc(100% + 1cqh);top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--f-display);font-size:3cqh;color:#7a2b00;background:#ffe9a8;border-radius:2cqh;padding:.4cqh 1.6cqh;animation:tch .7s ease-in-out infinite alternate}
.mis.done{border-color:var(--gold);box-shadow:0 0 1.4cqh rgba(242,193,78,.7)}.mis.done em{display:block}
@keyframes tch{to{transform:translateY(-50%) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.mis em{animation:none}}
.stage.cut .mis{visibility:hidden}
.inv{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2.4cqh;align-items:start}
.doll{display:flex;flex-direction:column;gap:1.2cqh;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:1.6cqh;padding:1.4cqh}
.cpw{text-align:center;font-family:var(--f-display);font-size:3.4cqh;color:#ff9a4a}
.dollg{display:grid;grid-template-columns:13cqh 1fr 13cqh;gap:1cqh;align-items:center}
.dcol{display:flex;flex-direction:column;gap:1cqh}
.dslot{position:relative;width:13cqh;height:13cqh;flex:none;border:2px solid var(--line);border-radius:1.4cqh;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:0;color:inherit;font:inherit}
.dslot img{max-height:70%;max-width:80%}
.dslot .cl{position:absolute;left:.5cqh;bottom:.2cqh;font-size:1.9cqh}.dslot .cn{position:absolute;right:.5cqh;top:.1cqh;font-size:2cqh;color:var(--gold)}.dslot .ph{font-size:2.1cqh;color:var(--mute)}
.dchar{display:flex;align-items:center;justify-content:center}.dchar img{max-height:34cqh;max-width:100%;object-fit:contain;filter:drop-shadow(0 1cqh 1.4cqh rgba(0,0,0,.5))}
.ftabs{display:flex;gap:.6cqh;flex-wrap:wrap}.ftabs .btn{padding:.6cqh 1.4cqh;font-size:2.4cqh}
.invr{display:flex;flex-direction:column;gap:1.2cqh;min-width:0}
.ovl{position:absolute;inset:0;z-index:6;background:rgba(4,8,10,.62);display:flex;align-items:center;justify-content:center;border-radius:2cqh}
.ovl .idet{width:min(92cqh,86%);max-height:92%;overflow:auto;background:#1b2630;box-shadow:0 1cqh 4cqh rgba(0,0,0,.6)}
.skrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(26cqh,1fr));gap:1.4cqh}
.skc{display:flex;flex-direction:column;align-items:center;gap:.6cqh;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:1.6cqh;padding:1.4cqh 1cqh}
.skc img{width:13cqh;height:13cqh;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.skc .name{font-size:3cqh}.skc .sub{font-size:2.2cqh;min-height:6cqh}
.trow{display:grid;grid-template-columns:8cqh 1fr auto;gap:1.6cqh;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:1.6cqh;padding:1.2cqh 1.6cqh}
.tico{width:8cqh;height:8cqh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:3cqh;color:#14202a}
.pop header{display:flex;align-items:center;justify-content:space-between;padding:1.8cqh 2.4cqh;border-bottom:1px solid var(--line)}
.pop h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:4.4cqh;color:var(--gold)}
.pop .x{background:transparent;border:1px solid var(--line);border-radius:50%;width:7cqh;height:7cqh;font-size:3.4cqh}
.body{overflow-y:auto;padding:2.2cqh 2.4cqh;display:flex;flex-direction:column;gap:1.8cqh;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;justify-content:space-between;gap:2cqh;min-width:0}
.row > div{min-width:0}
.lbl{font-size:2.7cqh;color:var(--mute)}
.val{font-family:var(--f-display);font-size:3.8cqh;font-variant-numeric:tabular-nums}
.sec{font-family:var(--f-display);font-size:3.8cqh;color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqh 3cqh}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqh}
.slot{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:1.4cqh;padding:1.4cqh 1cqh;display:flex;flex-direction:column;gap:.6cqh;min-width:0}
.slot .k{font-size:2.4cqh;color:var(--mute)}
.slot .n{font-weight:700;font-size:2.7cqh;line-height:1.3}
.slot .e{color:var(--gold);font-size:2.3cqh}
.slot.on{border-color:var(--gold)}
button.slot{text-align:left;color:inherit;font:inherit;cursor:pointer}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(11cqh,1fr));gap:1cqh}
.cell{position:relative;aspect-ratio:1;border:2px solid var(--line);border-radius:1.4cqh;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;padding:0;color:inherit;font:inherit}
.cell.on{box-shadow:0 0 0 2px var(--gold)}
.cell .cl{position:absolute;left:.6cqh;bottom:.3cqh;font-size:2cqh}.cell .cn{position:absolute;right:.6cqh;top:.2cqh;font-size:2.2cqh;color:var(--gold)}.cell .up{position:absolute;right:.5cqh;bottom:.2cqh;font-size:2.2cqh;color:#58d08a}
.idet{border:1px solid var(--line);border-radius:1.6cqh;padding:1.6cqh 1.8cqh;display:flex;flex-direction:column;gap:1cqh;background:rgba(255,255,255,.05)}
.istat{display:flex;gap:2cqh;align-items:baseline;font-size:3.2cqh;flex-wrap:wrap}.istat span{font-size:2.6cqh}
.iopts{display:flex;gap:1cqh;flex-wrap:wrap}.iopts span{font-size:2.5cqh;padding:.4cqh 1.2cqh;border-radius:2cqh;background:rgba(242,193,78,.14);color:var(--gold)}
.ibtns{display:flex;gap:1cqh;flex-wrap:wrap}.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grades{display:flex;gap:2.4cqh;font-size:2.8cqh;flex-wrap:wrap}
.item.unown .name{color:var(--mute)}
.item{display:flex;align-items:center;justify-content:space-between;gap:2cqh;padding:1.6cqh 2cqh;background:rgba(255,255,255,.06);border-radius:1.4cqh}
.item .name{font-weight:700}
.item .sub{font-size:2.6cqh;color:var(--mute);margin-top:.3cqh}
.btn{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:1.2cqh;padding:1.2cqh 2.2cqh;flex:none;font-size:2.9cqh}
.btn.gold{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.plus{width:6.4cqh;height:6.4cqh;padding:0;font-family:var(--f-display);font-size:4cqh}
.pts{font-size:2.9cqh;color:var(--gold)}
.tog{display:flex;align-items:center;gap:1.4cqh;font-size:3cqh}
.tog input{width:3.6cqh;height:3.6cqh;accent-color:var(--gold)}
.note{font-size:2.6cqh;color:var(--mute);line-height:1.6;margin:0}
.danger{color:var(--crimson);border-color:var(--crimson);background:transparent}
.mate{display:grid;grid-template-columns:auto 1fr;gap:.4cqh 2cqh;align-items:center}
.mate i{width:5cqh;height:5cqh;border-radius:50%;grid-row:span 2}

/* 알림 카드 */
#modal{position:absolute;inset:0;background:rgba(5,10,10,.7);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1a2427;border:1px solid var(--gold);border-radius:2cqh;padding:3.6cqh;width:min(70cqh,80%);display:flex;flex-direction:column;gap:2cqh;text-align:center}
.card h2{font-family:var(--f-display);font-weight:400;font-size:5cqh;margin:0;color:var(--gold);text-wrap:balance}
.card p{margin:0;line-height:1.6;font-size:3cqh}
.card button{background:var(--gold);color:#1a1a1a;border:none;border-radius:1.4cqh;padding:1.8cqh;font-family:var(--f-display);font-size:3.8cqh}

/* 캐릭터 선택 */
.sel{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:3cqh 4%;
  background:radial-gradient(ellipse at 50% 30%,rgba(40,60,66,.94),rgba(7,11,12,.97) 70%);text-align:center}
.sel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:6.4cqh;color:var(--gold)}
.sel p{margin:0;color:var(--mute);font-size:3cqh}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqh;width:min(100%,160cqh)}
.ccard{display:flex;flex-direction:column;align-items:center;gap:.6cqh;padding:2cqh 1.4cqh;border-radius:2cqh;background:rgba(255,255,255,.06);border:1px solid var(--line);min-width:0;transition:transform .15s,border-color .15s}
.ccard:hover,.ccard:focus-visible{transform:translateY(-.8cqh);border-color:var(--gold)}
.ccard img{height:30cqh;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 1cqh 1.4cqh rgba(0,0,0,.5))}
.ccard b{font-family:var(--f-display);font-weight:400;font-size:4.6cqh}
.ccard .cj{font-size:2.8cqh;color:var(--gold)}
.ccard .cr{font-size:2.4cqh;color:var(--mute);line-height:1.4;min-height:6.8cqh}
.ccard .cl{margin-top:.6cqh;font-family:var(--f-display);font-size:3cqh;padding:.6cqh 2cqh;border-radius:2cqh;background:rgba(242,193,78,.16);color:#ffe9a8}
.ccard.new .cl{background:rgba(255,255,255,.08);color:var(--fg)}

.rotate{position:fixed;inset:0;z-index:30;background:rgba(7,11,12,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}

/* ===== 스킨 v20: 일러스트 UI ===== */
:root{--glass:rgba(22,20,52,.82);--glass2:rgba(30,27,68,.9);--line:rgba(190,180,255,.22);--mute:#b4b3d6;--gold:#ffcf4a;

.btn:disabled{filter:grayscale(.75);opacity:.55}
.btn[aria-pressed="true"]{background:linear-gradient(#ffe36b,#ffb52a);border-color:#fff0a6;border-bottom-color:#b96a08;color:var(--ink);text-shadow:0 .15cqh 0 rgba(255,255,255,.55)}
.danger{background:linear-gradient(#8a2f4a,#5b1c33);border-color:#e0708a;border-bottom-color:#30101c;color:#ffd9e0}

/* 팝업 */
.pop{background:linear-gradient(var(--pn1),var(--pn2));border:.45cqh solid var(--trim);border-radius:3cqh;top:9cqh;bottom:15cqh;

.pop header{position:relative;justify-content:center;padding:0;height:5.4cqh;border-bottom:none;flex:none}
.pop h2{position:absolute;left:50%;top:-6.2cqh;transform:translateX(-50%);width:62cqh;height:12.9cqh;display:flex;align-items:center;justify-content:center;
  background:url(assets/ui_banner.webp) center/100% 100% no-repeat;color:#fff3c4;font-size:4.6cqh;text-shadow:0 .3cqh 0 #3a1f6e,0 0 1.2cqh rgba(0,0,0,.6);letter-spacing:.1em;padding-bottom:.4cqh;pointer-events:none}
.pop .x{position:absolute;right:-2.4cqh;top:-2.8cqh;width:8cqh;height:8cqh;border-radius:50%;background:radial-gradient(circle at 50% 30%,#ff7b7b,#c22a3c);border:.45cqh solid var(--trim);
  color:#fff;font-size:3.6cqh;box-shadow:0 .5cqh 0 #5d1220,0 1cqh 2cqh rgba(0,0,0,.5);z-index:2}
.body{padding:1.6cqh 2.6cqh 2.4cqh;scrollbar-width:thin;scrollbar-color:#6a60bd transparent}
.sec{color:#ffe08a;text-shadow:0 .25cqh 0 rgba(0,0,0,.45)}
.pts{font-family:var(--f-display);background:rgba(0,0,0,.35);border:1px solid rgba(255,207,74,.5);border-radius:3cqh;padding:.5cqh 1.8cqh;color:#ffe08a}
.item,.setrow,.trow,.skc,.slot,.idet,.doll{background:linear-gradient(rgba(96,86,190,.30),rgba(40,35,98,.42));border:1px solid rgba(160,148,255,.35);border-radius:1.8cqh;box-shadow:inset 0 .2cqh 0 rgba(255,255,255,.08)}
.item .name,.trow .name,.skc .name{font-family:var(--f-display);font-weight:400;font-size:3.2cqh}
.note{background:rgba(0,0,0,.22);border-radius:1.4cqh;padding:1.2cqh 1.8cqh}
.val{color:#fff}
.ovl{background:rgba(10,8,30,.72);border-radius:2.6cqh}.ovl .idet{background:linear-gradient(#3a3178,#1f1c47);border-width:.4cqh}
.iopts span{background:rgba(255,207,74,.16);border:1px solid rgba(255,207,74,.4);color:#ffe08a}
/* 인벤토리 칸 */
.cell,.dslot{--g:#8f88c9;border:.35cqh solid var(--g);border-radius:1.8cqh;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--g) 46%,transparent),rgba(12,10,36,.82) 74%);box-shadow:inset 0 0 0 .25cqh rgba(0,0,0,.35),inset 0 .5cqh .6cqh rgba(255,255,255,.14)}
.cell img,.dslot img{filter:drop-shadow(0 .4cqh .4cqh rgba(0,0,0,.55))}
.cell.on{box-shadow:0 0 0 .4cqh #fff,0 0 1.6cqh var(--g)}
.cell .cl,.dslot .cl{font-family:var(--f-display);text-shadow:0 0 .4cqh #000,0 0 .4cqh #000}
.cell .cn,.dslot .cn{font-family:var(--f-display);color:#ffe08a;text-shadow:0 0 .4cqh #000,0 0 .4cqh #000}
.dslot .sil{height:52%;width:auto;opacity:.38;filter:none}
.dslot.empty{--g:#5d578f;border-style:dashed}
.cpw{display:flex;align-items:center;justify-content:center;gap:1cqh;color:#ffb057;background:rgba(0,0,0,.3);border-radius:3cqh;padding:.5cqh 0;text-shadow:0 .25cqh 0 rgba(0,0,0,.5)}

.dchar{background:radial-gradient(ellipse at 50% 88%,rgba(255,207,74,.28),transparent 62%)}
.ftabs .btn{display:flex;align-items:center;gap:.6cqh;padding:.6cqh 1.3cqh}

.ftabs .btn[aria-pressed="true"] img{filter:brightness(.25)}

/* 훈련 · 스킬 */
.tico{background:radial-gradient(circle at 50% 35%,#5b51b6,#221e52);border:.3cqh solid var(--trim);width:9cqh;height:9cqh;box-shadow:0 .4cqh 0 rgba(0,0,0,.35)}

.trow{grid-template-columns:9cqh 1fr auto}
.skc img{border:none;box-shadow:0 0 0 .4cqh var(--trim),0 0 0 .7cqh #2a1c54,0 .8cqh 1.4cqh rgba(0,0,0,.5)}
/* 아래 메뉴 */
.menu{bottom:.6cqh;gap:.2cqh}
.menu button{width:10.6cqh;font-size:2.5cqh;gap:0;text-shadow:0 0 .5cqh #000,0 .25cqh 0 #000,0 0 .8cqh #000;transition:transform .12s}

.menu button[aria-pressed="true"]{background:none;color:#ffe08a;transform:translateY(-1.2cqh) scale(1.1)}
.menu button[aria-pressed="true"] img{filter:drop-shadow(0 0 1cqh #ffd34a) drop-shadow(0 .5cqh .5cqh rgba(0,0,0,.6))}
.menu .dot::after{top:-7.6cqh;right:-.6cqh;width:2cqh;height:2cqh;border:.3cqh solid #fff;box-sizing:border-box;background:#ff3d55}
/* 방향키 */
.dpad button{background:url(assets/ui_arrow.webp) center/100% 100% no-repeat;border:none;border-radius:2.6cqh;font-size:0;color:transparent;filter:drop-shadow(0 .5cqh .5cqh rgba(0,0,0,.5))}
.dpad button:active{background:url(assets/ui_arrow.webp) center/100% 100% no-repeat;filter:brightness(1.35) drop-shadow(0 0 1cqh #ffd34a)}
#bR{transform:rotate(90deg)}#bD{transform:rotate(180deg)}#bL{transform:rotate(-90deg)}
/* 점프는 오른쪽 버튼으로 옮겼으므로 왼쪽은 좌·우·아래만 */
#sideBg{position:fixed;z-index:-1;inset:-4%;background:#0b0a1e center/cover no-repeat;filter:blur(10px) brightness(.5) saturate(1.1);pointer-events:none}
.stage.wide{overflow:visible}
.stage.wide #modal{left:calc(var(--sx,0px)*-1);right:calc(var(--sxr,0px)*-1)}
/* 넓은 화면의 양옆: 배경 그림을 거울처럼 뒤집어 이어 붙여 풍경이 끊기지 않게 한다 (노치 쪽 끝까지) */
#sideL,#sideR{display:none;position:absolute;top:0;height:100%;background-repeat:no-repeat;background-size:var(--sw,100%) 100%;transform:scaleX(-1);pointer-events:none}
.stage.wide #sideL{display:block;right:100%;width:var(--sx,0px);background-position:left top}
.stage.wide #sideR{display:block;left:100%;width:var(--sxr,0px);background-position:right top}
.stage.wide .dpad{translate:calc(var(--ox,0px)*-1) 0}
.stage.wide #bAtk,.stage.wide .ks,.stage.wide #bJ2,.stage.wide #potB{translate:var(--ox,0px) 0}
#bJ,#bL,#bR,#bD,.dpad i{display:none}.dpad{display:block;width:27cqh;height:27cqh;left:3%;bottom:5cqh}
#stick{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(70,60,150,.5),rgba(18,16,46,.72) 72%);border:.45cqh solid rgba(232,181,72,.85);box-shadow:0 .6cqh 1.2cqh rgba(0,0,0,.45),inset 0 0 2cqh rgba(0,0,0,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 50% 32%,#8a7df0,#2e2874 75%);border:.4cqh solid #ffd66b;box-shadow:0 .5cqh .8cqh rgba(0,0,0,.5),inset 0 .4cqh .4cqh rgba(255,255,255,.3);pointer-events:none;will-change:transform}
#stick.on #knob{filter:brightness(1.25)}
.dpad i{background:none}
/* 공격 · 스킬 */
#bAtk{background:url(assets/ui_atk.webp) center/100% 100% no-repeat;border:none;filter:drop-shadow(0 .8cqh .8cqh rgba(0,0,0,.55));justify-content:flex-end;padding-bottom:1.6cqh}
#bAtk svg{display:none}
#bAtk small{color:#fff;font-family:var(--f-display);text-shadow:0 0 .4cqh #000,0 0 .4cqh #000;background:rgba(10,8,30,.6);border-radius:2cqh;padding:0 1.2cqh}
#bAtk.on{background:url(assets/ui_atk.webp) center/100% 100% no-repeat;filter:brightness(1.3) drop-shadow(0 0 1.6cqh #ffd34a)}
.ks{border:none;overflow:visible;background:radial-gradient(circle at 50% 40%,var(--kc,rgba(120,200,255,.32)),rgba(14,12,40,.95) 72%);filter:drop-shadow(0 .5cqh .5cqh rgba(0,0,0,.55))}
.ks::after{content:"";position:absolute;inset:-9%;background:url(assets/ui_ring.webp) center/100% 100% no-repeat;pointer-events:none;z-index:3}
.ks .nm img{inset:3%;width:94%;height:94%}
.ks small{z-index:4;font-family:var(--f-display);color:#fff;background:rgba(10,8,30,.62);border-radius:2cqh;padding:.1cqh .9cqh;margin-bottom:-.6cqh}
.ks .cd{z-index:2;font-family:var(--f-display);border-radius:50%;background:rgba(8,6,26,.68)}
.ks.lock{background:radial-gradient(circle at 50% 40%,#2c2860,#131130 72%);border:none}
.ks.lock::after{filter:grayscale(1) brightness(.7)}
#bJ2{right:calc(2% + 34.5cqh);bottom:4cqh;width:11.5cqh;height:11.5cqh;border-radius:50%;border:.4cqh solid #ffd66b;background:radial-gradient(circle at 50% 32%,#6a5fd0,#262062 75%);
  font-family:var(--f-display);font-size:3.2cqh;color:#fff;text-shadow:0 .25cqh 0 rgba(0,0,0,.6);box-shadow:0 .5cqh 0 rgba(0,0,0,.45),inset 0 .4cqh .4cqh rgba(255,255,255,.25);touch-action:none;transform-origin:right bottom}
#bJ2:active{filter:brightness(1.35)}
#potB{background:linear-gradient(#3a3178,#1f1c47);border:.3cqh solid var(--trim);font-family:var(--f-display);color:#fff;box-shadow:0 .4cqh 0 rgba(0,0,0,.4)}
#potB small{color:#b9f5c4;font-family:var(--f-display)}
.ks.nomp{filter:grayscale(.8) brightness(.7)}
.svbox{width:100%;height:14cqh;box-sizing:border-box;background:rgba(0,0,0,.35);color:#e9e6ff;border:1px solid #6a62ad;border-radius:1.4cqh;padding:1.2cqh;font:2.2cqh/1.4 ui-monospace,monospace;resize:none;word-break:break-all;user-select:text;-webkit-user-select:text}
/* 위쪽 버튼 */
#bB{width:auto;min-width:19cqh;padding:0 2cqh 0 1.2cqh;height:7cqh;top:1.5cqh;flex-direction:row;gap:.8cqh;background:linear-gradient(#ff6a6a,#c2203a);border:.3cqh solid #ffd27a;border-bottom:.6cqh solid #6a0f1f;
  text-shadow:0 .25cqh 0 rgba(0,0,0,.5);box-shadow:0 0 1.6cqh rgba(255,80,80,.65)}
#bB::before{content:"";width:5cqh;height:5.6cqh;background:url(assets/ui_i3.webp) center/contain no-repeat;flex:none}
#bB:disabled{background:linear-gradient(#3a3178,#1f1c47);border-color:#6a62ad;border-bottom-color:#12102c;color:#cfcdf0;box-shadow:none}
#bB:disabled::before{filter:grayscale(.8) brightness(.8)}
#bA{background:linear-gradient(#3a3178,#1f1c47);border:.3cqh solid #6a62ad;border-bottom:.6cqh solid #12102c;color:#cfcdf0}
#bA[aria-pressed="true"]{background:linear-gradient(#ffe36b,#ffb52a);border-color:#fff0a6;border-bottom-color:#b96a08;color:var(--ink);box-shadow:0 0 1.4cqh rgba(255,207,74,.6)}
#bG,#bF{background:radial-gradient(circle at 50% 30%,#4a4391,#221e52);border:.3cqh solid var(--trim);box-shadow:0 .4cqh 0 rgba(0,0,0,.4)}
/* 퀘스트 카드 */
.mis{grid-template-columns:7cqh 1fr;column-gap:1.2cqh;align-items:center;width:46cqh;background:linear-gradient(rgba(58,49,120,.92),rgba(27,24,64,.92));border:.3cqh solid #7d74cc;border-radius:1.8cqh;box-shadow:0 .5cqh 0 rgba(0,0,0,.35)}
.mis>img{grid-row:1/4;height:7.4cqh;width:auto;justify-self:center;filter:drop-shadow(0 .3cqh .3cqh rgba(0,0,0,.5))}
.mis b{color:#ffe08a}.mis span{white-space:nowrap;font-size:2.2cqh}.lbl{white-space:nowrap}.mis i{height:1.4cqh;border:1px solid rgba(255,255,255,.2)}.mis u{background:linear-gradient(90deg,#ffb52a,#ffe36b)}
.mis.done{border-color:var(--gold);box-shadow:0 0 1.8cqh rgba(255,207,74,.85)}
.mis em{background:linear-gradient(#ffe36b,#ffb52a);color:var(--ink);border:.3cqh solid #fff0a6;box-shadow:0 .4cqh 0 #b96a08}
/* 알림 카드 · 캐릭터 선택 · 안내 */
.card{background:linear-gradient(var(--pn1),var(--pn2));border:.45cqh solid var(--trim);border-radius:3cqh;box-shadow:0 0 0 .35cqh #2a1c54,0 2cqh 6cqh rgba(0,0,0,.6)}
.stry{display:flex;align-items:center;gap:2.6cqh;text-align:left;min-height:25cqh}.stry img{height:25cqh;width:auto;max-width:26cqh;object-fit:contain;flex:none;filter:drop-shadow(0 .6cqh .8cqh rgba(0,0,0,.5))}
.stry p{font-size:2.9cqh;line-height:1.7;margin:0;color:#e9e6ff}.stry.say p{color:#fff;font-size:3.1cqh}.stry b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.8cqh;margin-bottom:.6cqh}
#mcard:has(.stry){width:min(96cqh,88%);position:relative}
.card button.skip{background:none;border:none;border-bottom:none;box-shadow:none;color:var(--mute);font-size:2.4cqh;padding:0;text-decoration:underline;align-self:center}
.card .pg{position:absolute;right:2.4cqh;top:2cqh;font-size:2.2cqh;color:var(--mute)}
.card h2{color:#ffe08a;text-shadow:0 .3cqh 0 rgba(0,0,0,.5)}
.card button{background:linear-gradient(#ffe36b,#ffb52a);border:1px solid #fff0a6;border-bottom:.6cqh solid #b96a08;color:var(--ink)}
.sel{background:radial-gradient(ellipse at 50% 28%,rgba(78,62,160,.96),rgba(13,11,34,.98) 72%)}
.sel h2{width:70cqh;height:14.6cqh;display:flex;align-items:center;justify-content:center;background:url(assets/ui_banner.webp) center/100% 100% no-repeat;color:#fff3c4;font-size:5cqh;text-shadow:0 .3cqh 0 #3a1f6e;letter-spacing:.1em}
.ccard{background:linear-gradient(rgba(96,86,190,.42),rgba(40,35,98,.6));border:.35cqh solid #7d74cc;border-radius:2.4cqh;box-shadow:0 .7cqh 0 rgba(0,0,0,.35)}
.ccard.last{border-color:var(--trim);background:linear-gradient(rgba(140,110,200,.5),rgba(60,45,120,.65));box-shadow:0 0 2cqh rgba(255,207,74,.5),0 .7cqh 0 rgba(0,0,0,.35)}
.ccard .cl{background:linear-gradient(#ffe36b,#ffb52a);color:var(--ink);border-bottom:.4cqh solid #b96a08}
.ccard.new .cl{background:linear-gradient(#4a4391,#2f2a66);color:#fff;border-bottom:.4cqh solid #1d1a45}
.editbar{background:linear-gradient(var(--pn1),var(--pn2));border:.3cqh solid var(--trim)}
.sw{background:rgba(0,0,0,.4);border:1px solid #6a62ad}.sw:checked{background:linear-gradient(#ffe36b,#ffb52a)}
@media (orientation:portrait){body:not(.skip) .rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 한글 단위: 1만 2345 / 1억 2345만 / 425조 / 12경 3400조 */
function kor(n){
  n=Math.floor(n);if(n<10000)return n.toLocaleString('ko-KR');
  const U=[[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
  for(let i=0;i<U.length;i++){const[v,u]=U[i];if(n>=v){const a=Math.floor(n/v),r=n-a*v;let s=a.toLocaleString('ko-KR')+u;
    if(i<3){const[v2,u2]=U[i+1],b=Math.floor(r/v2);if(b)s+=' '+b+u2;}else if(r)s+=' '+r;return s;}}
}

function hMerge(h){if(h.lv>=HCAP[h.g])return false;const m=hMat(h);if(!m)return false;S.heroes.splice(S.heroes.indexOf(m),1);h.lv++;return true;}
function hPromote(h){if(h.g>=4||h.lv<HCAP[h.g])return false;const m=hMat(h,true);if(!m)return false;S.heroes.splice(S.heroes.indexOf(m),1);h.g++;h.lv=1;return true;}
function hDeploy(h){const i=S.team.indexOf(h.id);if(i>=0){S.team.splice(i,1);return true;}if(S.team.length<hSlots()){S.team.push(h.id);return true;}return false;}
function hAuto(){let n=0,go=true;while(go){go=false;for(let g=0;g<5;g++){
    const tg=S.heroes.filter(h=>h.g===g&&h.lv<HCAP[g]).sort((a,b)=>(S.team.includes(b.id)-S.team.includes(a.id))||b.lv-a.lv)[0];if(tg&&hMerge(tg)){n++;go=true;break;}

function hurtPlayer(a,pf){

  /* 방어력으로 줄어든 피해와, 최대 체력 비례 최소 피해 중 큰 쪽을 받는다(후반에도 몬스터가 위협이 되게) */
  /* 방어력은 최소 피해를 절반까지만 줄인다. 보스 예고 패턴(pf)은 최대 체력 비례 큰 피해 */
  const df=defAll(),DF=0.5+0.5*220/(220+df),fl=maxHp()*(pf?pf*DF:FLOORP*clamp(a/mobStat(gs()).atk,1,7)*DF);

  sfx('hurt');P.hp-=d;P.hurt=0.2;addText('-'+kor(d),P.x,P.y-72,'#ff6b6b');

    if(mode==='boss')endBoss(false);
    else{P.dead=2;mobs=[];mshots=[];flash('쓰러졌어요 · 잠시 후 다시 일어나요','#ff6b6b');}
  }
}

function mateUpdate(dt){

      else for(let i=0;i<3;i++)shots.push({x:c.x+i*6,y:sy-i*4,tx,ty,v:540+i*40,d:rollDmg(1,baseAtk()*c.pw*1.8),c:c.m.shot,big:1,fx:c.m.fx});

/* ---------- 이동·AI ---------- */
function jump(){if(P.gr&&P.dead<=0&&!paused){P.vy=-580;P.gr=false;}}
function dropDown(){if(P.gr&&P.f>0&&P.dead<=0&&!paused){P.drop=P.f;P.gr=false;P.vy=60;}}
function physics(dt){
  if(P.gr){if(!floorAt(P.f,P.x)&&P.f>0){P.gr=false;P.vy=0;}return;}
  const ny=P.y+(P.vy+=G*dt)*dt;
  if(P.vy>0){for(let i=F.length-1;i>=0;i--){const f=F[i];
    if(i!==P.drop&&floorAt(i,P.x)&&P.y<=f.y+1&&ny>=f.y){P.y=f.y;P.vy=0;P.gr=true;P.f=i;P.drop=-1;return;}}}
  P.y=ny;
}
function walk(dir,dt,sp){P.x+=dir*sp*dt;P.face=dir;P.moving=true;}
function ai(dt){
  if(!P.gr)return;
  let tf,tx;
  if(mode==='boss'&&boss){tf=0;tx=boss.x-(C().rng>100?190:55);if(zones.length)return;}
  else{
    P.aiT-=dt;
    if(P.aiT<=0||!P.tgt||P.tgt.dead){P.aiT=0.35;let best=null,bc=1e9;
      /* 체력이 낮으면 위층(강한 몬스터)을 피해서 아래층에서 사냥 */
      const hr=P.hp/maxHp(),cap=hr<0.4?0:hr<0.65?1:3;
      for(const m of mobs){if(m.dead)continue;const c=Math.abs(m.x-P.x)+Math.abs(m.f-P.f)*170+(m.f>cap?2000:0);if(c<bc){bc=c;best=m;}}P.tgt=best;}
    if(!P.tgt)return;tf=P.tgt.f;tx=P.tgt.x;
  }
  if(tf===P.f){const dx=tx-P.x;if(Math.abs(dx)>(mode==='boss'?6:(C().rng>100?C().rng*0.65:30)))walk(Math.sign(dx),dt,160);else P.face=mode==='boss'?1:(Math.sign(dx)||1);}
  else if(tf>P.f){const n=F[P.f+1],gx=clamp(tx,n.x1+18,n.x2-18);
    if(Math.abs(gx-P.x)>8)walk(Math.sign(gx-P.x),dt,160);else jump();}
  else{
    if(floorAt(P.f-1,P.x)||P.f-1===0)dropDown();
    else{const n=F[P.f-1],gx=clamp(tx,n.x1+18,n.x2-18);walk(Math.sign(gx-P.x)||1,dt,160);}
  }
}

/* ---------- 몬스터 행동: 근거리는 다가가서 때리고, 원거리는 거리를 두고 쏜다 ---------- */
let mshots=[];
function mobAI(m,dt){
  const fl=F[m.f];m.anim=Math.max(0,m.anim-dt);m.atkT-=dt;m.walking=false;
  if(m.born>0)return;
  const dx=P.x-m.x,same=P.gr&&P.f===m.f&&P.dead<=0,ad=Math.abs(dx);
  if(m.anim>0){ // 공격 동작 중
    const half=m.rng?0.38:0.32;
    if(!m.hitDone&&m.anim<half){m.hitDone=true;
      if(m.rng)mshots.push({x:m.x+(m.dir>0?12:-12),y:fl.y-m.h*0.55-(m.fly?18:0),vx:(m.dir>0?1:-1)*(m.rng==='spear'?300:230),k:m.rng,d:m.atk,life:1.8,f:m.f});
      else if(same&&ad<44&&Math.sign(dx)===m.dir)hurtPlayer(m.atk);}
    return;}
  if(same&&ad<(m.rng?260:170)){
    m.dir=Math.sign(dx)||m.dir;
    const want=m.rng?(ad>190?1:ad<90?-1:0):(ad>30?1:0);
    if(want){m.x+=m.dir*want*(m.rng?30:44)*dt;m.walking=true;}
    if(m.atkT<=0&&(m.rng?ad<230:ad<40)){m.atkT=m.rng?2.4:1.7;m.anim=m.rng?0.75:0.6;m.hitDone=false;}
  }else{m.x+=m.dir*22*dt;m.walking=true;}
  if(m.x<fl.x1+14||m.x>fl.x2-14){m.dir*=-1;m.x=clamp(m.x,fl.x1+14,fl.x2-14);}
}
function mshotUpdate(dt){

function drawMshots(){

/* ---------- 직업별 스킬 ---------- */
const alive=t=>!!t&&(t.w?t===boss:(!t.dead&&mobs.includes(t)));
const tgtX=t=>t.w?t.x+t.w/2:t.x;
const tgtY=t=>t.w?F[0].y-t.h*0.5:F[t.f].y-(t.h||30)*0.5-(t.fly?18:0);
const pool=()=>mode==='boss'?(boss?[boss]:[]):mobs.filter(m=>!m.dead&&m.born<=0);
function skillTargets(s){
  const px=P.x,py=P.y-30,L=pool(),d=t=>Math.hypot(tgtX(t)-px,tgtY(t)-py);
  if(mode==='boss')P.face=1;
  else if(s.kind==='rain'||s.kind==='line'||s.kind==='dash'||s.kind==='snipe'){const n=L.filter(m=>m.f===P.f).sort((a,b)=>Math.abs(a.x-px)-Math.abs(b.x-px))[0];if(n)P.face=Math.sign(n.x-px)||P.face;}
  const half=t=>t.w?t.w/2:0,fwd=t=>(tgtX(t)-px)*P.face>-20,same=t=>t.w?P.f===0:t.f===P.f;
  switch(s.kind){
    case 'nova':case 'whirl':return L.filter(t=>d(t)<s.R+half(t));
    case 'rain':{const ax=px+P.face*170;return L.filter(t=>Math.abs(tgtX(t)-ax)<160+half(t)&&Math.abs(tgtY(t)-py)<150);}
    case 'line':case 'snipe':return L.filter(t=>same(t)&&fwd(t));
    case 'quake':return L.filter(same);
    case 'chain':return L.filter(t=>d(t)<460).sort((a,b)=>d(a)-d(b)).slice(0,s.multi);
    case 'clone':return L.filter(t=>d(t)<420).sort((a,b)=>d(a)-d(b)).slice(0,s.multi);
    case 'awk':return L.slice();
    case 'burst':{const c0=L.filter(t=>d(t)<320).sort((a,b)=>d(a)-d(b))[0];if(!c0)return[];
      const x0=tgtX(c0),y0=tgtY(c0),r=L.filter(t=>Math.hypot(tgtX(t)-x0,tgtY(t)-y0)<110+half(t));r.cx=x0;r.cy=y0;return r;}
    case 'meteor':return L.slice().sort(()=>Math.random()-0.5).slice(0,s.multi);
    case 'stars':return L.filter(t=>d(t)<340).sort((a,b)=>d(a)-d(b)).slice(0,s.multi);
    case 'dash':return L.filter(t=>same(t)&&fwd(t)&&Math.abs(tgtX(t)-px)<260+half(t));
  }return[];
}
function tryCast(n,force){
  const s=skillOf(n);if(!s||S.job<s.job||!(S.sk[s.id]>0)||P.dead>0)return;
  const key=SKK[n];if(P[key]>0)return;
  const t=skillTargets(s);if(!t.length&&!force)return;
  {const mc=mpCost(n);if((P.mp||0)<mc){useMana();if((P.mp||0)<mc){if(force)addText('마나 부족',P.x,P.y-86,'#7ecbff');return;}}P.mp-=mc;}
  P[key]=s.cd*(1-Math.min(0.5,pas('cdr')+optSum('cdr')));
  const fire=()=>{P.anim=P.animD=0.6;P.cast=P.castM=0.6;P.castC=s.col;addText(s.name+'!',P.x,P.y-86,s.col,true);sfx('strike');shake=0.22;slow=Math.max(slow,0.07);doSkill(s,skillTargets(s),s.mult(S.sk[s.id]));};
  if(s.kind==='awk'&&S.opt.cutin!==false){cutin={t:1.3,m:1.3,s,fn:fire};$('#stage').classList.add('cut');sfx('win');return;}
  fire();
}
function doSkill(s,t,mult){

    case 'whirl':fx.push({whirl:1,x:px,y:py,t:0.9,m:0.9});
      for(let k=0;k<s.hits;k++)setTimeout(()=>{if(k%2===0){P.anim=P.animD=0.3;P.face*=-1;}t.forEach(m=>{if(alive(m))hit(m,rollDmg(mult),col);});},k*120);break;
    case 'rain':fx.push({rain:1,x:px+P.face*170,y:P.y,w:330,t:0.85,m:0.85});for(let k=0;k<s.hits;k++)go(160+k*130);break;
    case 'line':{const fl=F[P.f],x1=P.face>0?(mode==='boss'&&boss?boss.x+boss.w:fl.x2):fl.x1;
      fx.push({beam:1,x0:px+P.face*14,x1,y:py,t:0.55,m:0.55});for(let k=0;k<s.hits;k++)go(60+k*70);break;}
    case 'quake':fx.push({strike:1,R:200,x:px,y:py,t:0.6,m:0.6});fx.push({quake:1,y:P.y,x1:F[P.f].x1,x2:F[P.f].x2,t:0.55,m:0.55,c:col});shake=0.4;for(let k=0;k<s.hits;k++)go(80+k*130);break;
    case 'snipe':{const fl=F[P.f],x1=P.face>0?(mode==='boss'&&boss?boss.x+boss.w:fl.x2):fl.x1;
      fx.push({beam:1,big:1,x0:px+P.face*14,x1,y:py,t:0.7,m:0.7});shake=0.3;go(120);go(300);break;}
    case 'chain':{const pts=[[px,py-6]].concat(t.map(m=>[tgtX(m),tgtY(m)]));if(t.length===1&&t[0].w)pts.push([tgtX(t[0])+40,tgtY(t[0])-50],[tgtX(t[0])-30,tgtY(t[0])+30]);
      for(let k=0;k<s.hits;k++){setTimeout(()=>fx.push({chain:1,pts,t:0.24,m:0.24,c:col}),k*150);go(k*150+40);}
      if(t.length===1&&t[0].w)for(let k=0;k<s.hits*2;k++)go(500+k*90);break;}

function update(dt){
  ttlT-=dt;if(ttlT<=0&&!selecting){ttlT=1;ttlCheck();}comboT-=dt;if(comboT<=0)combo=0;comboP=Math.max(0,comboP-dt);if(evt){evt.t-=dt;if(evt.t<=0)evt=null;}wflash=Math.max(0,wflash-dt);
  time+=dt;shake=Math.max(0,shake-dt);
  for(const t of texts){t.t-=dt*0.85;t.y-=26*dt;}texts=texts.filter(t=>t.t>0);
  for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(cutin){cutin.t-=dt;if(cutin.t<=0){const c=cutin;cutin=null;$('#stage').classList.remove('cut');if(P.dead<=0)c.fn();}return;}
  if(paused)return;
  P.anim=Math.max(0,P.anim-dt);P.swing=Math.max(0,P.swing-dt);P.cast=Math.max(0,(P.cast||0)-dt);P.hurt=Math.max(0,P.hurt-dt);P.skT=Math.max(0,P.skT-dt);for(let n=2;n<5;n++)P[SKK[n]]=Math.max(0,(P[SKK[n]]||0)-dt);P.potT=Math.max(0,P.potT-dt);
  if(P.dead>0){P.dead-=dt;if(P.dead<=0){P.hp=maxHp();P.x=400;P.y=F[0].y;P.f=0;P.gr=true;}return;}

  P.moving=false;
  if(P.dir){walk(P.dir,dt,210);P.manual=1.5;}
  else if(P.manual>0)P.manual-=dt;
  else ai(dt);
  P.x=clamp(P.x,12,mode==='boss'&&boss&&P.f===0?boss.x-14:W-12);
  physics(dt);

  const c=C();P.atkT-=dt;
  if(P.atkT<=0){
    const t=mode==='boss'?(boss&&P.gr&&P.f===0&&boss.x-P.x<c.rng&&boss.x+boss.w-P.x>-30?[boss]:[])
      :mobs.filter(m=>!m.dead&&m.born<=0&&P.gr&&m.f===P.f&&Math.abs(m.x-P.x)<c.rng).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x)).slice(0,c.tg);
    if(t.length){P.atkT=c.aspd*(1-Math.min(0.5,pas('aspd')));P.anim=P.animD=c.ad;
      const t0=t[0];P.face=mode==='boss'?1:(Math.sign(tgtX(t0)-P.x)||P.face);
      if(c.shot){fx.push({proj:1,k:c.shot,x0:P.x+P.face*14,y0:P.y-34,x1:tgtX(t0),y1:tgtY(t0),t:0.14,m:0.14,c:c.col});
        setTimeout(()=>{if(!alive(t0))return;hit(t0,rollDmg(1));
          if(c.splash&&!t0.w)mobs.forEach(m=>{if(m!==t0&&alive(m)&&m.f===t0.f&&Math.abs(m.x-t0.x)<c.splash)hit(m,rollDmg(0.6));});},140);}
      else for(let k=0;k<(c.hits||1);k++)setTimeout(()=>t.forEach(m=>{if(alive(m))hit(m,rollDmg(c.hits>1?0.6:1));}),k*120);}
    else if(atkHold){P.atkT=c.aspd*(1-Math.min(0.5,pas('aspd')));P.anim=P.animD=c.ad;sfx('hit');
      if(c.shot){const x1=clamp(P.x+P.face*c.rng*0.8,10,W-10);fx.push({proj:1,k:c.shot,x0:P.x+P.face*14,y0:P.y-34,x1,y1:P.y-34,t:0.14,m:0.14,c:c.col});}}
  }
  if(atkHold)P.manual=Math.max(P.manual,0.6);
  if(wantStrike)want[1]=1;if(wantWhirl)want[2]=1;wantStrike=false;wantWhirl=false;
  for(let n=1;n<5;n++){if(S.autoSkill||want[n])tryCast(n,!!want[n]);want[n]=0;}
  if(P.hp<maxHp()*0.35)usePotion();
  P.mpT=Math.max(0,(P.mpT||0)-dt);if(P.mp===undefined)P.mp=maxMp();P.mp=Math.min(maxMp(),P.mp+maxMp()*MPREG*dt);
  if(trLv('reg')&&P.hp<maxHp()&&P.hp>0)P.hp=Math.min(maxHp(),P.hp+maxHp()*trLv('reg')*0.0002*dt);
  P.safe=(P.safe||0)+dt;if(P.safe>4&&P.hp<maxHp()){P.hp=Math.min(maxHp(),P.hp+maxHp()*0.03*dt);}

  if(mode==='hunt'){
    spawnT-=dt;if(spawnT<=0&&mobs.length<11){spawn();spawnT=0.6;}
    for(const m of mobs){
      m.hurt=Math.max(0,m.hurt-dt);m.ph+=dt;m.born=Math.max(0,m.born-dt);m.stk.t-=dt;
      mobAI(m,dt);
    }
    mobs=mobs.filter(m=>!m.dead);
    mshotUpdate(dt);
  }else if(boss){
    boss.hurt=Math.max(0,boss.hurt-dt);boss.anim=Math.max(0,boss.anim-dt);boss.stk.t-=dt;bossTime-=dt;
    if(bossTime<=0){endBoss(false);return;}
    boss.patT-=dt;if(boss.patT<=0)bossPattern();
    mateUpdate(dt);
    for(const z of zones){z.t-=dt;if(z.t<=0){z.done=true;fx.push({zone:z,t:0.25,m:0.25});shake=0.15;if(P.x>z.x&&P.x<z.x+z.w)hurtPlayer(z.dmg,z.pf);}}
    zones=zones.filter(z=>!z.done);
    for(const w of waves){if(w.warn>0){w.warn-=dt;continue;}w.x-=380*dt;
      if(!w.hit&&Math.abs(w.x-P.x)<20&&P.y>F[0].y-30){w.hit=true;hurtPlayer(w.dmg,PF.wave);}}
    waves=waves.filter(w=>w.x>-40);
  }
}

  cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=Math.max(0,Math.min(1,o.a===undefined?1:o.a));cx.translate(x,y);if(o.r)cx.rotate(o.r);cx.scale((o.fx||1)*(o.sx||1),o.sy||1);
  cx.drawImage(im,-w*(o.ax===undefined?0.5:o.ax),-h*(o.ay===undefined?0.5:o.ay),w,h);cx.restore();return true;}

      cx.font='15px Jua, sans-serif';cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='rgba(60,10,10,.85)';cx.strokeText('점프하거나 발판 위로!',wx/2+60,bot-52);cx.fillStyle='#ffe0e0';cx.fillText('점프하거나 발판 위로!',wx/2+60,bot-52);continue;}

    else if(f.lvup){const p=1-k,im=getImg('ui_lvup');if(ok(im)){const z=p<0.18?0.4+p/0.18*0.75:p<0.26?1.15-(p-0.18)/0.08*0.15:1,w=96*z,hh=w*im.height/im.width;
      cx.save();cx.globalAlpha=p>0.75?(1-p)/0.25:1;cx.drawImage(im,P.x-w/2,P.y-92-p*16-hh,w,hh);cx.restore();}}
    else if(f.dust){const p=1-k;cx.save();cx.globalAlpha=0.5*k;cx.fillStyle='#e8dcc0';for(let j=0;j<3;j++){cx.beginPath();cx.arc(f.x+f.d*(4+j*5)*p,f.y-p*(5+j*3),2.5+p*(4-j),0,7);cx.fill();}cx.restore();}
    else if(f.coin){const p=1-k,q=p*p,im=getImg('ui_i0'),x=f.x+(172-f.x)*q,y=f.y+(54-f.y)*q-Math.sin(p*Math.PI)*34;if(ok(im)){const z=13-p*4;cx.drawImage(im,x-z/2,y-z/2,z,z);}}
    else if(f.loot){const p=1-k,im=icoImg(f.k);let x,y;

    else if(f.ghost){cx.save();cx.globalAlpha=Math.min(0.7,k*1.2);drawImg(S.ch,f.x,f.y,62,f.dir);cx.restore();fxI('k_slash',f.x+f.dir*22,f.y-32,96,{a:k*1.5,r:(1-k)*0.8});}
    else if(f.ring){cx.strokeStyle=`rgba(${f.c},${k})`;cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,(1-k)*40+8,0,7);cx.stroke();}
    else if(f.strike){const q=1-k,sc=(f.R||180)/180;
      fxI('v_slam',f.x,f.y+26,(200+q*330)*sc,{a:k*1.6});fxI('v_slash',f.x,f.y-4,(170+q*130)*sc,{a:k*1.5,r:-0.5+q*1.4,fx:P.face});}
    else if(f.whirl){const q=1-k;fxI('v_cyclone',f.x,f.y,300+q*340,{r:time*15,a:k*1.5,sy:0.62});fxI('v_cyclone',f.x,f.y,190+q*200,{r:-time*11,a:k,sy:0.62});}
    else if(f.proj){const q=1-k,x=f.x0+(f.x1-f.x0)*q,y=f.y0+(f.y1-f.y0)*q,ang=Math.atan2(f.y1-f.y0,f.x1-f.x0);
      if(f.k==='arrow')fxI('e_arrow',x,y,74,{r:ang,ax:0.8});

      else{fxI('y_burst',x,y,44,{r:time*8});}}
    else if(f.rain){const q=1-k;const g=cx.createLinearGradient(0,f.y-190,0,f.y);g.addColorStop(0,'rgba(255,240,170,0)');g.addColorStop(1,`rgba(255,240,170,${k*0.22})`);cx.fillStyle=g;cx.fillRect(f.x-f.w/2,f.y-190,f.w,190);
      for(let i=0;i<16;i++){const ax=f.x-f.w/2+((i*61)%f.w),ay=f.y-185+((q*640+i*43)%185);fxI('e_arrow',ax,ay,66,{r:1.9,ax:0.85,a:Math.min(1,k*2.4)});}}
    else if(f.beam){const len=Math.abs(f.x1-f.x0),dir=f.x1>f.x0?1:-1,mid=(f.x0+f.x1)/2;
      fxI(f.big?'e_pierce':'e_beam',mid,f.y,Math.max(120,len*1.06),{fx:dir,a:k*1.7,sy:f.big?1+k*0.6:1.1+k*0.6});
      for(let i=0;i<3;i++){const u=((1-k)*1.6+i/3)%1;fxI('e_arrow',f.x0+(f.x1-f.x0)*u,f.y+(i-1)*9,70,{fx:dir,a:k*1.5});}}
    else if(f.burst){const q=1-k,im=f.im||'y_burst';
      if(im==='v_awk')fxI(im,f.x,f.y+60,150+q*40,{ay:1,a:k*1.7,sy:0.5+Math.min(1,q*3)*0.5});

    else if(f.dash){const dir=Math.sign(f.x1-f.x0)||1,len=Math.abs(f.x1-f.x0);cx.globalAlpha=k*0.45;for(let i=0;i<4;i++)drawImg(S.ch,f.x0+(f.x1-f.x0)*(i/4),f.y,62,dir);cx.globalAlpha=1;
      for(let i=0;i<3;i++)fxI('k_slash',f.x0+(f.x1-f.x0)*(0.2+i*0.3),f.y-30,len*0.5,{a:k*1.5,r:(i-1)*0.5,fx:dir});}
    else if(f.meteor){const p=1-k,mx=f.x-150+p*150,my=f.y-170+p*170;
      if(p<0.9)fxI('y_meteor',mx,my,120,{ax:0.78,ay:0.8});else fxI('y_burst',f.x,f.y,90+(p-0.9)*900,{a:(1-p)*10});}
  }

function drawCutin(){
  const c=cutin,p=1-c.t/c.m,im=getImg('cut_'+S.ch),e=Math.min(1,p/0.22),ez=1-Math.pow(1-e,3),out=p>0.86?(p-0.86)/0.14:0,col=c.s.col;
  cx.save();cx.fillStyle=`rgba(4,6,12,${0.72*Math.min(1,p/0.12)*(1-out)})`;cx.fillRect(0,0,W,H);
  const y0=96,h=258,sk=46;cx.globalAlpha=1-out;
  cx.beginPath();cx.moveTo(sk,y0);cx.lineTo(W,y0);cx.lineTo(W-sk,y0+h);cx.lineTo(0,y0+h);cx.closePath();cx.save();cx.clip();
  cx.fillStyle='#0a0d14';cx.fillRect(0,y0,W,h);
  if(ok(im)){const sc=Math.max(W/im.width,h/im.height)*1.12,iw=im.width*sc,ih=im.height*sc;cx.drawImage(im,(W-iw)/2+(1-ez)*W*0.9-p*26,y0+(h-ih)*0.42,iw,ih);}
  const g=cx.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(0.25,'rgba(0,0,0,0)');g.addColorStop(0.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.7)');cx.fillStyle=g;cx.fillRect(0,y0,W,h);
  cx.restore();
  cx.strokeStyle=col;cx.lineWidth=3;cx.beginPath();cx.moveTo(sk,y0);cx.lineTo(W,y0);cx.moveTo(W-sk,y0+h);cx.lineTo(0,y0+h);cx.stroke();
  cx.textAlign='left';cx.font='15px Jua, sans-serif';cx.fillStyle='#fff';cx.fillText(`${C().name} · ${C().jobs[4]}`,40-(1-ez)*200,y0+h-44);
  cx.font='34px Jua, sans-serif';cx.lineWidth=6;cx.strokeStyle='rgba(0,0,0,.8)';cx.strokeText(c.s.name,38-(1-ez)*260,y0+h-12);cx.fillStyle=col;cx.fillText(c.s.name,38-(1-ez)*260,y0+h-12);
  if(out>0){cx.globalAlpha=out*0.8;cx.fillStyle='#fff';cx.fillRect(0,0,W,H);}
  cx.restore();}

$('#panel').addEventListener('input',e=>{const el=e.target;if(el.dataset.act!=='vol')return;S.opt[el.dataset.k]=+el.value;applyOpt();});
$('#panel').addEventListener('pointermove',()=>{panelTouch=performance.now();});
$('#panel').addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='vol'){save();return;}if(el.dataset.act!=='opt')return;const k=el.dataset.k;
  if(k==='autoSkill')S.autoSkill=el.checked;else if(k==='autoPot')S.autoPot=el.checked;else S.opt[k]=el.checked;
  applyOpt();syncButtons();save();});
let panelTouch=0;$('#panel').addEventListener('scroll',()=>{panelTouch=performance.now();},{passive:true});$('#panel').addEventListener('pointerdown',()=>{panelTouch=performance.now();});

/* ---------- 조작 ---------- */
function hold(el,d){const on=e=>{e.preventDefault();P.dir=d;},off=()=>{if(P.dir===d)P.dir=0;};
  el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));}
hold($('#bL'),-1);hold($('#bR'),1);
$('#bJ').addEventListener('pointerdown',e=>{e.preventDefault();P.manual=1.5;jump();});
$('#bJ2').addEventListener('pointerdown',e=>{if(editing)return;e.preventDefault();P.manual=1.5;jump();});
$('#bD').addEventListener('pointerdown',e=>{e.preventDefault();P.manual=1.5;dropDown();});
/* 이동 스틱: 좌우로 밀면 이동, 아래로 끝까지 밀면 한 층 내려가기 */
{const sk=$('#stick'),kn=$('#knob');let pid=null,dropped=false;
 const mv=e=>{const r=sk.getBoundingClientRect(),R=r.width/2;let dx=(e.clientX-r.left-R)/R,dy=(e.clientY-r.top-R)/R;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
   kn.style.transform=`translate(${dx*R*0.55}px,${dy*R*0.55}px)`;P.dir=dx<-0.28?-1:dx>0.28?1:0;
   if(dy>0.65&&Math.abs(dx)<0.6){if(!dropped){dropped=true;P.manual=1.5;dropDown();}}else if(dy<0.4)dropped=false;},
  end=()=>{pid=null;dropped=false;P.dir=0;kn.style.transform='';sk.classList.remove('on');};
 sk.addEventListener('pointerdown',e=>{if(editing)return;e.preventDefault();pid=e.pointerId;try{sk.setPointerCapture(pid);}catch(_){}sk.classList.add('on');mv(e);});
 sk.addEventListener('pointermove',e=>{if(pid===e.pointerId)mv(e);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>sk.addEventListener(t,e=>{if(pid===e.pointerId||t==='lostpointercapture')end();}));}
$('#mis').addEventListener('click',()=>{if(editing)return;if($('#mis').dataset.main){if(!mqClaim())openPop('town');}else claimQuest();});
document.querySelectorAll('.ks').forEach(b=>b.addEventListener('click',()=>{want[+b.dataset.n]=1;}));
{const ba=$('#bAtk'),on=e=>{if(editing)return;e.preventDefault();atkHold=1;ba.classList.add('on');},off=()=>{atkHold=0;ba.classList.remove('on');};
 ba.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>ba.addEventListener(t,off));}
$('#bB').addEventListener('click',()=>{if(mode==='boss')endBoss(false);else startBoss();});
$('#bA').addEventListener('click',()=>{S.autoSkill=!S.autoSkill;save();syncButtons();});
const st=$('#stage');
if(st.requestFullscreen&&document.fullscreenEnabled){const bf=$('#bF');bf.hidden=false;
  bf.addEventListener('click',()=>{(document.fullscreenElement?document.exitFullscreen():st.requestFullscreen()).catch(()=>{});});}
cv.addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
const actOf=k=>{const K=S.opt.keys;for(const a in K)if(K[a]===k)return a;return null;};
addEventListener('keydown',e=>{if(selecting)return;const k=e.key.toLowerCase();
  if(waitKey){e.preventDefault();if(k!=='escape'){for(const a in S.opt.keys)if(S.opt.keys[a]===k)S.opt.keys[a]=S.opt.keys[waitKey];S.opt.keys[waitKey]=k;save();}
    waitKey=null;renderPanel();return;}
  if(k==='escape'){if(editing)endEdit();else if(tab)closePop();else openPop('set');return;}
  if(e.repeat)return;const a=actOf(k);if(!a)return;e.preventDefault();
  if(a==='left'){P.dir=-1;keys.l=1;}else if(a==='right'){P.dir=1;keys.r=1;}
  else if(a==='jump'){P.manual=1.5;jump();}else if(a==='down'){P.manual=1.5;dropDown();}
  else if(a==='atk')atkHold=1;else if(SKKEY.includes(a))want[SKKEY.indexOf(a)]=1;
  else if(a==='boss'){if(mode==='boss')endBoss(false);else startBoss();}});
addEventListener('keyup',e=>{const a=actOf(e.key.toLowerCase());
  if(a==='left'){keys.l=0;P.dir=keys.r?1:0;}
  if(a==='right'){keys.r=0;P.dir=keys.l?-1:0;}
  if(a==='atk')atkHold=0;});
function syncButtons(){sideBg();
  const bb=$('#bB');
  if(mode==='boss'){bb.textContent='포기하기';bb.disabled=false;}
  else{const nl=S.lv<needLv();bb.textContent=nl?`Lv.${needLv()} 필요`:S.kills>=10?'보스 도전':`보스 ${S.kills}/10`;bb.disabled=nl||S.kills<10||P.dead>0;}
  for(let n=1;n<5;n++){const b=$('#k'+n),sk=skillOf(n),open=sk&&S.job>=sk.job,on=open&&S.sk[sk.id]>0,t=P[SKK[n]]||0;
    b.classList.toggle('lock',!on);b.disabled=!on;b.classList.toggle('nomp',on&&(P.mp||0)<mpCost(n)&&potSum(MPK)<=0);
    if(sk){b.style.setProperty('--kc',sk.col+'55');b.style.setProperty('--kb',sk.col+'aa');b.style.color=on?sk.col:'';}
    {const want=(open?sk.ic:'lock')+(on?1:0),el=$('#kN'+n);if(el.dataset.v!==want){el.dataset.v=want;el.innerHTML=open?`<img src="assets/${sk.ic}.webp" alt="${sk.name}"${on?'':' style="filter:grayscale(1) brightness(.5)"'}>`:LOCKI;}}
    b.setAttribute('aria-label',sk?sk.name:'잠긴 스킬');$('#kK'+n).textContent=on?keyName(S.opt.keys[SKKEY[n]]||''):open?'배우기':'Lv'+SKLV[n];
    const cd=$('#kC'+n);cd.hidden=!(on&&t>0);if(on&&t>0)cd.textContent=Math.ceil(t);}
  $('#potN').textContent=potSum(HPK);$('#mpN').textContent=potSum(MPK);$('#potB').classList.toggle('low',potSum(HPK)<=0);$('#atkKey').textContent=keyName(S.opt.keys.atk||'z');
  $('#bA').setAttribute('aria-pressed',S.autoSkill);
  {const q=mqFix(),rp=S.q.n>=S.q.need,mOk=mqDone(),main=q.ch<STORY.length&&(mOk||!rp),m=$('#mis');m.dataset.main=main?1:'';
   if(main){const [gt,gp]=mqGoal(),[rg,rpn]=mqRw();m.classList.toggle('done',mOk);$('#misT').textContent=`메인 ${q.ch+1}장 · ${STORY[q.ch].t}`;$('#misP').textContent=mOk?`완료! 경험치 ${kor(rpn)} + ${kor(rg)}G`:gt;$('#misB').style.width=(mOk?100:gp*100)+'%';}
   else{m.classList.toggle('done',rp);$('#misT').textContent=`의뢰 ${S.q.no} · ${DG().name}`;$('#misP').textContent=rp?`완료! 보상 ${kor(qRw())}G + 포션 3개`:`몬스터 처치 ${S.q.n} / ${S.q.need}`;$('#misB').style.width=Math.min(100,S.q.n/S.q.need*100)+'%';}}
  $('#mGrow').classList.toggle('dot',TRN.some(T=>trLv(T.k)<trCap(T)&&S.gold>=trCost(trLv(T.k))*3));$('#mInv').classList.toggle('dot',S.bag.some(it=>S.eq[it.k]&&iScore(it)>iScore(S.eq[it.k])&&S.lv>=iLv(it)));
  $('#mChar').classList.toggle('dot',S.sp>0);$('#mSkill').classList.toggle('dot',S.kp>0&&C().sk.some(k=>(k.job===0?S.job===0:k.job<=S.job)&&(S.sk[k.id]||0)<k.max));
}

/* ---------- 알림 카드 ---------- */
const mq=[];let booting=true;
function queueModal(fn){if(!mq.includes(fn))mq.push(fn);if(!booting&&$('#modal').hidden)nextModal();}
function nextModal(){const fn=mq.shift();if(!fn){$('#modal').hidden=true;paused=false;return;}
  paused=true;P.dir=0;$('#mcard').innerHTML=fn();$('#modal').hidden=false;$('#mcard button').focus();}
$('#mcard').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='skipstory'){for(let i=mq.length-1;i>=0;i--)if(mq[i].story)mq.splice(i,1);nextModal();return;}
  if(b.dataset.act==='job'){S.sk.b0=0;S.job=1;S.kp=kpFix();flash(`${C().jobs[1]} 전직 완료! 스킬 메뉴에서 ${skillOf(1).name}을(를) 배워 보세요`,'#f2c14e');save();nextModal();openPop('skill');return;}
  if(b.dataset.act==='job2'){S.job=2;flash(`${C().jobs[2]} 전직 완료! ${skillOf(2).name}을(를) 배워 보세요`,'#9fe7ff');if(S.lv>=70)mq.push(job3Modal);save();nextModal();if($('#modal').hidden)openPop('skill');return;}
  if(b.dataset.act==='job3'||b.dataset.act==='job4'){S.job=b.dataset.act==='job3'?3:4;flash(`${C().jobs[S.job]} 전직 완료! ${skillOf(S.job).name}을(를) 배워 보세요`,skillOf(S.job).col);if(S.job===3&&S.lv>=120)mq.push(job4Modal);save();nextModal();if($('#modal').hidden)openPop('skill');return;}
  if(b.dataset.act==='godg'){nextModal();goDungeon(S.maxDg);return;}
  nextModal();});
function jobModal(){const c=C(),s=c.sk.find(x=>x.job===1&&x.kind);return `<h2>1차 전직</h2><p>10레벨이 되었어요. ${c.name}가 <b>${ro(c.jobs[1])}</b> 전직하면 공격 스킬 <b>${gwa(s.name)}</b> 패시브 3개가 열려요.</p><button data-act="job">${ro(c.jobs[1])} 전직하기</button>`;}
function jobNModal(n){const c=C(),s=skillOf(n),ps=c.sk.filter(x=>x.job===n&&!x.kind).map(x=>x.name).join(' · ');
  return `<h2>${n}차 전직${n===4?' · 각성':''}</h2><p>${n===3?70:120}레벨이 되었어요. ${c.name}가 <b>${ro(c.jobs[n])}</b> 전직하면 ${n===4?'각성 스킬':'공격 스킬'} <b>${gwa(s.name)}</b> 패시브 2개(${ps})가 열려요.${n===4?' 각성 스킬을 쓰면 캐릭터 컷인이 떠요.':''}</p><button data-act="job${n}">${ro(c.jobs[n])} 전직하기</button>`;}
function job3Modal(){return jobNModal(3);}
function job4Modal(){return jobNModal(4);}
function clearModal(){const d=DUNG[S.maxDg];return `<h2>${DUNG[S.maxDg-1].name} 클리어!</h2><p>새 던전 <b>${d.name}</b>(권장 ${d.lv}레벨)이 열렸어요. 마을 메뉴에서 언제든 오갈 수 있어요.</p><button data-act="godg">${ro(d.name)} 이동</button><button style="background:transparent;color:var(--fg);border:1px solid var(--line)">여기서 계속 사냥</button>`;}
function job2Modal(){const c=C(),s=skillOf(2),ps=c.sk.filter(x=>x.job===2&&!x.kind).map(x=>x.name).join(' · ');return `<h2>2차 전직</h2><p>30레벨이 되었어요. ${c.name}가 <b>${ro(c.jobs[2])}</b> 전직하면 공격 스킬 <b>${gwa(s.name)}</b> 패시브 2개(${ps})가 열려요.</p><button data-act="job2">${ro(c.jobs[2])} 전직하기</button>`;}
function goDungeon(i){if(i>S.maxDg||mode==='boss')return;S.prog[S.dg]=Math.max(S.prog[S.dg]||1,S.stage);S.dg=i;S.stage=S.prog[i]||1;S.kills=0;
  mobs=[];mshots=[];P.x=400;P.y=F[0].y;P.f=0;P.gr=true;spawnT=0;flash(`${DUNG[i].name} 도착!`,'#9fe7ff');save();dirty=true;}

/* ---------- 오프라인 보상 ---------- */
function offlineText(){
  const sec=Math.min(43200,(Date.now()-(S.last||Date.now()))/1000);if(sec<60)return null;
  const m=mobStat(gs()),kills=Math.floor(sec*0.4),g=Math.round(kills*m.gold*goldMul()),e=kills*m.exp,lv0=S.lv;S.tk=(S.tk||0)+kills;
  S.gold+=g;gainExp(e,true);P.hp=maxHp();
  const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60);
  return `<h2>쉬는 동안 ${C().name}가 사냥했어요</h2><p>${hh?hh+'시간 ':''}${mm}분 동안 몬스터 ${kor(kills)}마리<br>골드 +${kor(g)} · 경험치 +${kor(e)}${S.lv>lv0?`<br>레벨 ${lv0} → ${S.lv}`:''}</p><p style="color:var(--mute)">오프라인 보상은 최대 12시간까지 쌓여요.</p><button>받기</button>`;
}
function welcomeText(){const c=C();return `<h2>${c.name} 시작!</h2><p><b>${c.role}</b><br>주 스탯은 <b>${STN[c.main]}</b>이에요. 10·30·70·120레벨에 전직하고, 120레벨에는 각성 스킬이 열려요.</p><button>사냥 시작</button>`;}
/* ---------- 캐릭터 선택 ---------- */
function showSelect(){if(!selecting)save();selecting=true;sideBg();paused=true;P.dir=0;closePop();
  const last=lsGet(KEY+'-last');
  $('#cards').innerHTML=Object.keys(CLS).map(k=>{const c=CLS[k],o=summary(k);
    return `<button class="ccard${o?'':' new'}${k===last&&o?' last':''}" data-ch="${k}"><img src="assets/${k}.webp" alt=""><b>${c.name}</b><span class="cj">${c.jobs[1]} · 주 스탯 ${STN[c.main]}</span><span class="cr">${c.role}</span><span class="cl">${o?`Lv.${o.lv} ${c.jobs[o.job||0]} · 이어하기`:'새로 시작'}</span></button>`;}).join('');
  $('#sel').hidden=false;}
function loadChar(ch){
  S=load(ch);selecting=false;booting=true;
  Object.assign(P,{x:400,y:F[0].y,vy:0,f:0,gr:true,drop:-1,face:1,atkT:0,anim:0,swing:0,skT:0,skT2:0,skT3:0,skT4:0,potT:0,manual:0,dir:0,dead:0,hurt:0,tgt:null});
  mode='hunt';boss=null;mobs=[];mshots=[];mates=[];shots=[];zones=[];waves=[];texts=[];fx=[];spawnT=0;banner=null;
  if(S.clear&&!S.maxDg)S.maxDg=1;if(!S.prog)S.prog=[1,1];
  S.kp=kpFix();starterHero();
  mq.length=0;P.hp=maxHp();
  if(S.fresh)mq.push(welcomeText);else{const t=offlineText();if(t)mq.unshift(()=>t);}
  {const q=mqFix();if(!q.pro){q.pro=1;playScene('프롤로그 · 10년 전',PROLOG);if(q.ch<STORY.length)playScene(sceneTitle(q.ch,'a'),STORY[q.ch].a);}}
  if(S.lv>=10&&S.job===0&&!mq.includes(jobModal))mq.push(jobModal);
  if(S.lv>=30&&S.job===1&&!mq.includes(job2Modal))mq.push(job2Modal);
  if(S.lv>=70&&S.job===2&&!mq.includes(job3Modal))mq.push(job3Modal);
  if(S.lv>=120&&S.job===3&&!mq.includes(job4Modal))mq.push(job4Modal);
  delete S.fresh;save();booting=false;
  $('#sel').hidden=true;applyOpt();syncButtons();dirty=true;
  if(mq.length)nextModal();else paused=false;
}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-ch]');if(b){initAudio();sfx('click');loadChar(b.dataset.ch);}});

/* ---------- 루프 ---------- */
let last=performance.now(),uiT=0,saveT=0;
const FXK=['v_slash','v_slam','v_cyclone','v_quake','v_awk','e_arrow','e_beam','e_pierce','e_awk','y_burst','y_meteor','y_spark','y_awk','k_star','k_slash','k_awk','b_pillar','b_wave','b_orb','b_rune'];
let rdyKey='';
function assetsReady(){const key=S.ch+S.dg;if(rdyKey===key)return true;const D=DG();let okAll=true;
  for(const k of [D.bg,D.plat,...Object.keys(CLS),...D.tiers.flat().map(m=>m[0]),'fx_v_slash','fx_k_slash','fx_y_burst','fx_e_arrow'])if(!ok(getImg(k)))okAll=false;
  for(const k of [D.mini[0],D.fin[0],...Object.keys(CLS)])getImg(k);
  for(const m of D.tiers.flat()){getAnim(m[0]+'_walk');getAnim(m[0]+'_atk');}getAnim(D.mini[0]+'_atk');getAnim(D.fin[0]+'_atk');for(const c in CLS){getAnim(c+'_atk');getAnim(c+'_walk');}getAnim(S.ch+'_cast');
  for(const k of ['ui_warn','ui_clear','ui_defeat','ui_lvup','ui_i0','ui_i1','ui_ring'])getImg(k);
  for(const k of FXK)getImg('fx_'+k);for(const h of S.heroes)getImg(HEROES[h.h].k);
  if(okAll)rdyKey=key;return okAll;}
function drawLoading(){cx.fillStyle='#0d1417';cx.fillRect(0,0,W,H);cx.fillStyle='#f2c14e';cx.textAlign='center';cx.font='20px Jua, sans-serif';cx.fillText(DG().name+' 불러오는 중'+'.'.repeat(1+Math.floor(performance.now()/350)%3),W/2,H/2);}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!selecting&&!assetsReady()){drawLoading();requestAnimationFrame(loop);return;}
  if(slow>0){slow-=dt;update(dt*0.3);}else update(dt);draw();
  uiT-=dt;if(uiT<=0){uiT=0.2;syncButtons();if(dirty&&tab&&tab!=='set'&&now-panelTouch>800)renderPanel();}
  saveT-=dt;if(saveT<=0){saveT=5;save();}
  requestAnimationFrame(loop);
}
applyOpt();syncButtons();
booting=false;showSelect();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(loop);
})();
</script>
